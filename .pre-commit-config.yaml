# Pre-commit config snippet for the SIBLING public repo (~/Workspace/masoretic-benchmark/).
#
# Merge these `repos:` entries into the sibling repo's `.pre-commit-config.yaml`.
# DO NOT install in openmasorah — openmasorah has its own (lighter) hooks; see
# CLAUDE.md + Pitfall 8 (.planning/phases/01-gt-infra/01-RESEARCH.md).
#
# The two `local` hooks reference scripts copied to `scripts/` per the runbook
# in ./README.md.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: reject-binary-extensions
        name: "Reject *.jpg/*.pdf/*.png/... and anything under scans/"
        entry: python scripts/reject_binaries.py
        language: python
        pass_filenames: true

      - id: reject-private-paths
        name: "Reject private openmasorah workspace and local user path leaks"
        entry: python scripts/reject_private_paths.py
        language: python
        pass_filenames: true

      - id: manifest-append-only
        name: "Enforce phase_0_manifest.json append-only immutability"
        entry: python scripts/manifest_immutable.py
        language: python
        files: ^phase_0_manifest\.json$
        pass_filenames: false

      # A manifest edit re-fingerprints the manifest and strands every promoted
      # artifact carrying the old manifest_hash. Fires on both sides of that
      # coupling so a fuse cannot land without its rebind (and vice versa).
      - id: manifest-hash-rebound
        name: "Promoted results must bind to the current manifest_hash"
        entry: python scripts/rebind_manifest_hash.py --check
        language: python
        files: ^(phase_0_manifest\.json|results/.*\.json|scripts/rebind_manifest_hash\.py)$
        pass_filenames: false
        # The script imports masoretic_eval.manifest so the canonical-hash
        # algorithm has exactly one definition. That pulls in jsonschema, which
        # the isolated hook venv would otherwise lack.
        additional_dependencies:
          - jsonschema>=4.21

      # Each frozen folio's gt_hash must still match the bytes its gt_source
      # names. Fires on the goldens too: editing ground truth without re-fusing
      # would leave the manifest pinning bytes that no longer exist.
      - id: gt-hash-verified
        name: "Frozen folios' gt_hash must match their gt_source bytes"
        entry: python scripts/verify_gt_hash.py --check
        language: python
        files: ^(phase_0_manifest\.json|iaa_data/devarim_4folio/goldens/.*\.json|scripts/verify_gt_hash\.py)$
        pass_filenames: false

      # iaa_report.json must validate, stay iaa_status:real, and its projections-only
      # adjudication tier1-3 must recompute from the committed round-0 projections.
      - id: iaa-report-verified
        name: "iaa_report.json validates + pinned §5.2/§5.1 values intact"
        # --check-schema is jsonschema-only (no scorer import). The full --check,
        # which recomputes the tier1-3 adjudication counts via the scorer path
        # (rapidfuzz + grapheme), runs in CI and in the test suite instead — the
        # scorer runtime does not belong in an isolated pre-commit venv.
        entry: python scripts/generate_iaa_report.py --check-schema
        language: python
        files: ^(iaa_report\.json|schemas/iaa_report\.schema\.json|scripts/generate_iaa_report\.py)$
        pass_filenames: false
        additional_dependencies:
          - jsonschema>=4.21

      - id: validate-corpus
        name: "Validate corpus/manuscripts.yaml against schemas/manuscript.schema.json"
        entry: python scripts/validate_corpus.py
        language: python
        files: ^(corpus/.*\.ya?ml|schemas/manuscript\.schema\.json|scripts/validate_corpus\.py)$
        pass_filenames: false
        additional_dependencies:
          - pyyaml>=6.0
          - jsonschema>=4.21

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.20.0
    hooks:
      - id: gitleaks
