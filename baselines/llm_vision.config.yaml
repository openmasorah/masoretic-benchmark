# BL-01 LLM Vision Baseline configuration.
# Phase 3 Adjudication A-2 (2026-04-25): AbbyyFR was dropped. This config
# has TWO sources only: Claude Opus 4.7 + Gemini 2.5 Pro.
#
# Provider price changes mid-Phase 3 = a documented re-pin event:
# commit message + LLM_PIN.md row + run_meta.budget.rate_table_snapshot.
# NEVER silent drift.

models:
  claude:
    id: "claude-opus-4-7"
    # Anthropic pricing: https://www.anthropic.com/pricing
    # Retrieved: 2026-04-25
    input_per_mtok_usd: 5.00     # CORRECTED 2026-04-25 per RESEARCH.md verified pricing
    output_per_mtok_usd: 25.00   # CORRECTED 2026-04-25 per RESEARCH.md verified pricing
  gemini:
    id: "gemini-2.5-pro"
    # Google pricing: https://ai.google.dev/gemini-api/docs/pricing
    # Retrieved: 2026-04-25
    input_per_mtok_usd: 1.25
    output_per_mtok_usd: 10.00

cost_caps_usd:
  per_folio: 5.00     # A-02 LOCKED 2026-04-25 (Phase 03.1)
  per_run:   30.00    # A-02 LOCKED 2026-04-25 (Phase 03.1)
  # Manifest is authoritative source at runtime; this YAML seeds the
  # manifest at first promotion. Identical values appear in the
  # manifest's cost_caps_usd field after first Phase 03.1 promotion.

inference:
  max_output_tokens: 2048
  temperature: 0
  seed: 0  # forward-compat; not deterministic on gemini-2.5-pro per RESEARCH

combine:
  # D-07: alphabetical tie-break Claude < Gemini, so Claude wins ties.
  # WHOLE-LINE WINNER: NO tier-mixing across sources within a line.
  tie_break: "alphabetical"
