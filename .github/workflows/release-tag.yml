# Release-tag guard (D-16 / REL-07 / REL-09; ROADMAP Phase 4 criterion 4).
#
# WHY THIS EXISTS
# ---------------
# The planning docs asserted "CI enforces Yosef's written approve before the
# release tag fires." That was never true. Two separate facts:
#
#   1. `check-yosef-review-gate` in ci.yml is the Phase 03.1 A-03 gate. It
#      enforces a `[YOSEF-REVIEW]` *title prefix* on the first-of-kind BL-01 PR
#      and is spent by design once main carries a results/llm_vision/*.json.
#      It is NOT D-16's gate and never was.
#   2. `ci.yml` has no `tags:` trigger at all, so `audit_release.py`'s
#      release-tier checks (`_is_release_ref`, `check_iaa_report_real`) have
#      never once executed.
#
# HONEST LIMITATION -- read before trusting this file
# ---------------------------------------------------
# A `push: tags:` workflow runs *after* the tag object exists. It therefore
# cannot PREVENT a tag from being created. What it can do is fail loudly and
# refuse to publish. Enforcement is layered:
#
#   * This workflow is the ONLY sanctioned path to a public artifact. Nothing
#     is uploaded to HuggingFace, and no GitHub Release is created, except by a
#     job gated on `approval` passing.
#   * To also prevent tag *creation*, add a GitHub ruleset restricting who may
#     push refs matching `benchmark-v*`. That is a repo setting, not code.
#   * If this workflow fails, the tag must be deleted by hand:
#         git push origin :refs/tags/<tag>
#     It is deliberately NOT auto-deleted -- destroying a ref on failure is the
#     kind of "helpful" action that loses work.
#
# POLICY CHANGE 2026-07-29 -- approval OR lapsed review window
# ------------------------------------------------------------
# The original gate was approval-required, full stop. v0.1.0 was tagged without
# an approving review and the gate went publicly red. Leaving a permanently-red
# required gate is worse than having no gate: it trains everyone to ignore it.
#
# WHAT ACTUALLY HAPPENED -- corrected twice, so read this rather than the git
# history of this comment:
#
#   * GitHub was NEVER the review channel. The release runbook specifies a
#     packet sent to the reviewer directly. PR #45 therefore has no
#     `review_requested` event, no reviews, empty `requested_reviewers` --
#     by design, not oversight. (Verified against the API 2026-07-29.)
#   * The packet was sent 2026-07-23 by WhatsApp. That is the maintainer's
#     account of his own action; it is off-platform, so neither this repo nor
#     any mail archive corroborates it and this comment does not imply they do.
#   * No review arrived in the 6 days between packet and tag.
#   * The release proceeded under a decision, recorded in the project's planning
#     record beforehand, to take the review off the critical path: reviewer
#     credited, review folds into v0.1.1.
#
# Two earlier versions of this comment were wrong. The first said the reviewer
# "was requested" -- false. The second said the PR sat open 18 days awaiting
# review -- the PR was open 18 days, but the ask went out on day 12, so the
# response window was 6 days. Do not reintroduce 18 as a response-window figure;
# it overstates the wait by more than double.
#
# This matters for reading the policy below: v0.1.0 would fail the NEW gate too,
# via the never-requested refusal rather than the window -- because the review
# never ran through GitHub at all. The waiver is not a retroactive amnesty for
# that tag, and was not designed as one.
#
# The gate now passes a `benchmark-v*` tag if EITHER:
#
#   (a) a standing APPROVED review from the reviewer of record exists on the
#       release PR -- the original logic, unchanged; OR
#   (b) the reviewer was formally requested, and REVIEW_WINDOW_DAYS have passed
#       with no review of any kind from them. The job passes and logs a WAIVER.
#
# Everything else still fails: no PR, reviewer never requested, a review that
# exists but is not APPROVED (COMMENTED or REQUEST_CHANGES both block -- an
# engaged reviewer's silence is not lapse), or a window that has not lapsed.
#
# The window clock starts when the review was REQUESTED, not when the PR was
# opened. The two differ whenever the reviewer is added later, and starting at
# PR creation would credit the reviewer with days during which nobody had asked
# them for anything. This is strictly more conservative than a `created_at`
# clock: request time is never earlier than creation time.
#
# A waiver is a disclosure obligation, not an absolution. Every waived release
# must say so in CHANGELOG.md under Governance, and the deferred review folds
# into the next patch release. See CHANGELOG v0.1.1.
#
# CONFIGURATION REQUIRED
# ----------------------
# Repository variable `YOSEF_GH_USERNAME` must be set to the reviewing
# scholar's GitHub login. There is no default: an unset variable FAILS the
# gate rather than silently approving. (`ARI_GH_USERNAME` already exists; this
# one does not yet.)
#
#   gh variable set YOSEF_GH_USERNAME --body '<login>' \
#     --repo openmasorah/masoretic-benchmark

name: Release tag guard

on:
  push:
    tags:
      - "benchmark-v*"
  # Dry-run the whole gate against any ref without cutting a tag.
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to evaluate for the D-16 approval gate (dry run)"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

env:
  # Days the reviewer of record has to respond before a release may proceed
  # with a logged waiver. 14 is a policy choice, NOT calibrated to v0.1.0: this
  # comment previously justified it as "matching the observed 18-day stall",
  # which was wrong twice over -- the observed window was 6 days, and v0.1.0's
  # review never ran through GitHub, so it produced no window to calibrate to.
  REVIEW_WINDOW_DAYS: "14"

jobs:
  # --------------------------------------------------------------------------
  # REL-09 at release tier. Unlike the `gates` job in ci.yml, this passes
  # --release-tier, which turns on checks that have never run in CI before:
  # iaa_report.json must exist AND carry iaa_status == "real".
  # --------------------------------------------------------------------------
  release-audit:
    name: Release-tier egress + artifact audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit deps
        run: python -m pip install --quiet jsonschema>=4.21

      - name: audit_release --all --release-tier
        run: python scripts/audit_release.py --all --release-tier

      - name: Promoted results bind to current manifest_hash
        run: python scripts/rebind_manifest_hash.py --check

  # --------------------------------------------------------------------------
  # D-16: no tag, no HF upload, no announcement until the reviewer of record
  # leaves a WRITTEN "approve" review -- or the review window lapses with the
  # request outstanding, in which case the release proceeds with a logged
  # waiver. A thumbs-up reaction does not count, which is precisely why this
  # queries the reviews API and not reactions.
  # --------------------------------------------------------------------------
  approval:
    name: D-16 approval-or-lapsed-window gate
    runs-on: ubuntu-latest
    steps:
      - name: Require YOSEF_GH_USERNAME to be configured
        env:
          YOSEF: ${{ vars.YOSEF_GH_USERNAME }}
        run: |
          if [[ -z "${YOSEF}" ]]; then
            echo "::error::Repository variable YOSEF_GH_USERNAME is not set."
            echo "::error::D-16 cannot be enforced without it. Refusing to pass."
            echo "::error::  gh variable set YOSEF_GH_USERNAME --body '<login>' --repo ${{ github.repository }}"
            exit 1
          fi
          echo "Reviewer of record: ${YOSEF}"

      - name: Find the PR that introduced this commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          if [[ -n "${DISPATCH_PR:-}" ]]; then
            echo "numbers=${DISPATCH_PR}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Merged PRs whose merge/head commit is the tagged SHA.
          NUMBERS=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '[.[] | select(.merged_at != null) | .number] | join(" ")')
          if [[ -z "${NUMBERS}" ]]; then
            echo "::error::Tagged commit ${{ github.sha }} is not associated with any merged PR."
            echo "::error::D-16 requires the release to be reviewed in a PR. Refusing to pass."
            exit 1
          fi
          echo "numbers=${NUMBERS}" >> "$GITHUB_OUTPUT"

      - name: Approval, or a lapsed review window with the request outstanding
        env:
          GH_TOKEN: ${{ github.token }}
          YOSEF: ${{ vars.YOSEF_GH_USERNAME }}
          NUMBERS: ${{ steps.pr.outputs.numbers }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          window_days="${REVIEW_WINDOW_DAYS}"
          if ! [[ "${window_days}" =~ ^[0-9]+$ ]] || [[ "${window_days}" -lt 1 ]]; then
            echo "::error::REVIEW_WINDOW_DAYS must be a positive integer; got '${window_days}'."
            exit 1
          fi
          now_epoch=$(date -u +%s)

          approved=0          # (a) standing APPROVED review found
          waivable=0          # (b) requested + window lapsed + no review at all
          engaged=0           # reviewer responded, but not with an approval
          never_requested=0   # reviewer was never asked on any candidate PR
          pending=""          # human-readable "not yet lapsed" detail

          # Deliberately no --paginate: `gh api --paginate --jq` applies the
          # filter per page and emits one result per page, which silently
          # breaks any scalar query. per_page=100 covers every realistic
          # release PR, and each endpoint is fetched exactly once so the jq
          # below is plain jq with proper --arg quoting.
          work="$(mktemp -d)"

          for pr in ${NUMBERS}; do
            echo "--- PR #${pr} ---"
            gh api "repos/${REPO}/pulls/${pr}/reviews?per_page=100" > "${work}/reviews.json"
            gh api "repos/${REPO}/pulls/${pr}" > "${work}/pr.json"

            # Latest review state per user. An APPROVED later dismissed or
            # changed to REQUEST_CHANGES must not count, hence max_by(date).
            # COMMENTED is excluded from *approval* detection but is still a
            # response, so it is captured separately below.
            latest=$(jq -r 'map(select(.state != "COMMENTED"))
                            | group_by(.user.login)
                            | map(max_by(.submitted_at))
                            | .[] | "\(.user.login) \(.state)"' "${work}/reviews.json")
            echo "reviews: ${latest:-<none>}"

            if echo "${latest}" | grep -qx "${YOSEF} APPROVED"; then
              approved=1
              continue
            fi

            # Any review of any kind from the reviewer, COMMENTED included.
            # A reviewer who engaged and did not approve has not "lapsed";
            # their silence-after-speaking is a signal, not an absence.
            responses=$(jq -r --arg u "${YOSEF}" \
              'map(select(.user.login == $u)) | length' "${work}/reviews.json")
            if [[ "${responses}" -gt 0 ]]; then
              echo "reviewer responded ${responses}x without a standing approval"
              engaged=1
              continue
            fi

            # When was the review actually requested? Prefer the timeline's
            # review_requested event; fall back to PR creation only if the
            # timeline carries no such event but the request is still pending.
            gh api "repos/${REPO}/issues/${pr}/timeline?per_page=100" > "${work}/timeline.json"
            requested_at=$(jq -r --arg u "${YOSEF}" \
              '[.[] | select(.event == "review_requested"
                             and (.requested_reviewer.login // "") == $u)
                    | .created_at] | sort | first // ""' "${work}/timeline.json")
            still_pending=$(jq -r --arg u "${YOSEF}" \
              '[.requested_reviewers[]?.login] | index($u) != null' "${work}/pr.json")
            if [[ -z "${requested_at}" && "${still_pending}" == "true" ]]; then
              requested_at=$(jq -r '.created_at' "${work}/pr.json")
              echo "no review_requested event; falling back to PR created_at"
            fi

            if [[ -z "${requested_at}" ]]; then
              echo "reviewer '${YOSEF}' was never requested on PR #${pr}"
              never_requested=1
              continue
            fi

            requested_epoch=$(date -u -d "${requested_at}" +%s)
            elapsed_days=$(( (now_epoch - requested_epoch) / 86400 ))
            echo "requested ${requested_at} -> ${elapsed_days}d elapsed (window ${window_days}d)"

            if [[ "${elapsed_days}" -ge "${window_days}" ]]; then
              waivable=1
              waiver_pr="${pr}"
              waiver_days="${elapsed_days}"
            else
              pending="${pending} #${pr}:${elapsed_days}d"
            fi
          done

          if [[ "${approved}" -eq 1 ]]; then
            echo "D-16 satisfied: '${YOSEF}' has a standing APPROVED review."
            echo "D-16: approved by ${YOSEF}." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "${engaged}" -eq 1 ]]; then
            echo "::error::'${YOSEF}' reviewed PR(s) ${NUMBERS} without a standing approval."
            echo "::error::The window waiver covers NO response, not a withheld one. Refusing to pass."
            exit 1
          fi

          if [[ "${waivable}" -eq 1 ]]; then
            echo "::notice::D-16 waiver -- review window (${window_days}d) lapsed with no review from ${YOSEF}; review folds into the next patch release"
            {
              echo "### D-16 WAIVER"
              echo
              echo "Released without approval from \`${YOSEF}\`."
              echo "Requested on PR #${waiver_pr}; **${waiver_days} days** elapsed, window is ${window_days} days."
              echo
              echo "This must be disclosed in \`CHANGELOG.md\` under **Governance**,"
              echo "and the deferred review folds into the next patch release."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [[ "${never_requested}" -eq 1 ]]; then
            echo "::error::'${YOSEF}' was never requested as a reviewer on PR(s): ${NUMBERS}"
            echo "::error::A review you never asked for cannot lapse. Refusing to pass."
            exit 1
          fi

          echo "::error::No approval from '${YOSEF}' and the ${window_days}d window has not lapsed:${pending}"
          echo "::error::D-16: no HF upload, no tag, no announcement. Wait, or obtain the approval."
          exit 1

  # --------------------------------------------------------------------------
  # Publication is downstream of BOTH gates. This is the layer that makes the
  # post-hoc tag workflow meaningful: the tag existing is not the release.
  # --------------------------------------------------------------------------
  publish:
    name: Publish (blocked on both gates)
    needs: [release-audit, approval]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Gates cleared
        run: |
          echo "release-audit and D-16 approval both passed for ${{ github.ref_name }}."
          echo "HuggingFace upload + GitHub Release creation belong here (REL-01/REL-08)."
          echo "Not yet implemented -- see gap G2 in the planning repo's 260709-v1a FINDINGS.md."
