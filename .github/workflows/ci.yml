# GitHub Actions workflow for the SIBLING public repo (~/Workspace/masoretic-benchmark/).
#
# Copy to sibling repo's `.github/workflows/ci.yml` per ./README.md.
#
# PITFALL 8: this workflow does NOT invoke baalshem in any form (no vendoring,
# no cloning, no submodules). The F8 gate lives in baalshem and is NOT run
# here — this CI checks the sibling repo in isolation.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    # Nightly oracle-live drift detector (06:00 UTC); does NOT block PR merges.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (PyICU)
        run: sudo apt-get update && sudo apt-get install -y libicu-dev pkg-config

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy masoretic_eval

      - name: Unit tests (pytest)
        run: pytest -v --cov=masoretic_eval --cov-report=term-missing

      - name: External reference cross-val
        run: pytest tests/test_external_crossval.py -v

      - name: Manifest schema validation (jsonschema)
        run: |
          python -c "
          import json, jsonschema
          # Validate the committed sample fixture against the canonical schema.
          # The canonical phase_0_manifest.json (per CLAUDE.md scope-freeze rule)
          # has not landed at repo root yet — Phase 1 manifest-init writer ships
          # to a different path. Validation against the fixture proves schema +
          # validator are mutually consistent until the canonical file exists.
          manifest = json.loads(open('tests/fixtures/phase_0_manifest_sample.json').read())
          schema = json.loads(open('schemas/phase_0_manifest.schema.json').read())
          jsonschema.Draft202012Validator(schema).validate(manifest)
          print('manifest fixture validates against schema')
          "

  # ----------------------------------------------------------------------------
  # Phase 2 oracle CI: see oracles/README.md "## CI" section.
  # PR-blocking unit job + nightly non-blocking live drift detector.
  # Phase 1 GT-12 IAA gate is intentionally NOT added here -- Pitfall 8
  # carry-forward: sibling repo must be independently verifiable.
  # ----------------------------------------------------------------------------

  oracle-unit:
    name: Oracle unit tests (PR-blocking)
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyICU prerequisites
        run: sudo apt-get update && sudo apt-get install -y libicu-dev pkg-config

      - name: Install scorer (editable)
        run: pip install -e .

      - name: Install oracles core + dicta + dictabert + dev extras
        run: pip install -e "./oracles[dev,dicta,dictabert]"

      - name: Install oracles[nakdimon] (best-effort -- Pitfall 1)
        # nakdimon==0.1.2 pins TensorFlow 2.15, which has no wheel for Python
        # 3.12. Install best-effort and warn on failure -- mocked tests still
        # cover Nakdimon paths; the live job runs only on Python 3.11.
        run: |
          pip install -e "./oracles[nakdimon]" || \
            echo "::warning::Nakdimon install skipped on Python ${{ matrix.python-version }} (TF 2.15 + Python 3.12 incompat -- Pitfall 1). Mocked tests still cover Nakdimon paths."

      - name: Run oracle unit tests + ORA-06 contract test (not live_oracles)
        run: pytest oracles/tests/ -x -q -m "not live_oracles" --cov=oracles --cov-report=term-missing

  oracle-live:
    name: Oracle live drift (nightly, non-blocking)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    continue-on-error: true
    strategy:
      matrix:
        python-version: ["3.11"]   # Nakdimon TF 2.15 caps at 3.11
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyICU prerequisites
        run: sudo apt-get update && sudo apt-get install -y libicu-dev pkg-config

      - name: Install scorer + all oracle extras
        run: |
          pip install -e .
          pip install -e "./oracles[dev,dicta,dictabert,nakdimon]"

      - name: Run live oracle drift detector
        env:
          RUN_LIVE_ORACLES: "1"
        run: pytest oracles/tests/ -q -m "live_oracles" --tb=short

  # ----------------------------------------------------------------------------
  # Phase 3 baseline CI: see baselines/README.md "## CI" section.
  # Three-tier discipline (D-10 + D-11 corollary):
  #   baseline-unit    — PR-blocking, mocked, no kraken/PIL/transformers needed
  #   baseline-replay  — PR-blocking, replays committed llm_calls.jsonl fixtures
  #   baseline-live    — nightly cron, full real-API + real-model pass; non-blocking
  # Phase 1 GT-12 IAA gate (F8) is intentionally NOT added here -- Pitfall 8
  # carry-forward: sibling repo must be independently verifiable.
  # ----------------------------------------------------------------------------

  baseline-unit:
    name: Baseline unit tests (PR-blocking)
    runs-on: ubuntu-latest
    needs: [oracle-unit]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyICU prerequisites
        run: sudo apt-get update && sudo apt-get install -y libicu-dev pkg-config

      - name: Install scorer + oracles + baselines
        run: |
          pip install -e .
          pip install -e "./oracles[dev,dicta,dictabert]"
          pip install -e "./baselines[dev]"

      - name: Install nakdimon extra (Python 3.11 only -- Phase 2 Pitfall 1)
        # nakdimon==0.1.2 pins TensorFlow 2.15, which has no wheel for Python
        # 3.12. Install only on 3.11; mocked tests still cover Nakdimon paths
        # on 3.12 via sys.modules injection.
        if: matrix.python-version == '3.11'
        run: pip install -e "./oracles[nakdimon]"

      - name: Run baseline unit tests (mocked, env-gated tests skipped)
        # Includes the three structural invariants (contamination, A-3 grep,
        # D-15 declarations) plus 5 AST invariants (D-12, BASELINE_ID enum)
        # plus the DictaBERT disclaimer + KRAKEN_PIN provenance invariants.
        run: pytest baselines/tests/ -x -q -m "not live_baselines and not live_kraken" --cov=baselines --cov-report=term-missing

  baseline-replay:
    name: Baseline replay tests (PR-blocking)
    runs-on: ubuntu-latest
    needs: [baseline-unit]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyICU prerequisites
        run: sudo apt-get update && sudo apt-get install -y libicu-dev pkg-config

      - name: Install scorer + oracles + baselines
        run: |
          pip install -e .
          pip install -e "./oracles[dev,dicta,dictabert]"
          pip install -e "./baselines[dev]"

      - name: Run replay-mode tests against committed JSONL fixtures
        # No API keys: replay mode never calls live providers
        # (LLMVisionBaseline raises ReplayMissError on hash miss; never falls
        # through to a live API call). Exercises the real combine logic
        # against fixtures/llm_calls/*.replay.jsonl per D-10 + D-11 corollary.
        run: pytest baselines/tests/test_baseline_replay_llm_vision.py -x -q

  baseline-live:
    name: Baseline live drift (nightly, non-blocking)
    runs-on: ubuntu-latest
    needs: [baseline-unit]
    # Cron + manual trigger only; NEVER on push/PR.
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    continue-on-error: true
    strategy:
      matrix:
        python-version: ["3.11"]   # Pitfall 1: Linux + Py3.11 for real Nakdimon
    env:
      RUN_LIVE_BASELINES: "1"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install PyICU prerequisites
        run: sudo apt-get update && sudo apt-get install -y libicu-dev pkg-config

      - name: Install scorer + oracles + baselines (full)
        run: |
          pip install -e .
          pip install -e "./oracles[dev,dicta,dictabert,nakdimon]"
          pip install -e "./baselines[dev,kraken,llm]"

      # Cache the BiblIA Kraken model keyed on KRAKEN_MODEL_HASH (canonical
      # from KRAKEN_PIN.md per plan 03-04). When Phase 3.1 lands and runs
      # the real fixture pass, this cache is already populated.
      - name: Cache BiblIA Kraken model (keyed on KRAKEN_MODEL_HASH)
        uses: actions/cache@v4
        with:
          path: baselines/.cache/kraken
          key: kraken-biblia-8514a0c7cc2b5b45

      - name: Fetch BiblIA Kraken model (idempotent; skips if cached)
        run: python baselines/scripts/fetch_biblia_kraken_model.py

      - name: Run live baseline tests (real API spend; surfaces drift)
        run: pytest baselines/tests/ -q -m "live_baselines or live_kraken" --tb=short

      - name: Preflight - cost caps must be seeded in manifest
        env:
          PHASE_0_MANIFEST_PATH: ${{ github.workspace }}/../baalshem/phase_0_manifest.json
        run: python baselines/scripts/preflight_cost_caps.py

      - name: Phase 03.1 real fixture generation - all 4 baselines
        # Phase 03.1 D-08: real predictions on the IAA folios via the
        # baselines.run CLI module (created by plan 03.1-04 Task 3).
        # Sequential per D-03: BL-02 (Kraken) -> BL-01 (LLM, [YOSEF-REVIEW]
        # gate) -> BL-03 (Nakdimon chain) -> BL-04 (DictaBERT chain).
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          RUN_LIVE_BASELINES: "1"
          PHASE_0_MANIFEST_PATH: ${{ github.workspace }}/../baalshem/phase_0_manifest.json
        run: |
          python -m baselines.run --baseline biblia_kraken
          python -m baselines.run --baseline llm_vision
          python -m baselines.run --baseline biblia_nakdimon
          python -m baselines.run --baseline biblia_char_menaked

  # ----------------------------------------------------------------------------
  # Phase 03.1 A-03 two-tier review gate. The first-of-kind BL-01 PR (any PR
  # adding files under results/llm_vision/ when main has none) MUST carry the
  # [YOSEF-REVIEW] prefix in its PR title; subsequent BL-01 PRs auto-merge.
  # The gate ONLY runs on pull_request events; no manual nor scheduled trigger.
  # ----------------------------------------------------------------------------

  check-yosef-review-gate:
    name: Yosef-review gate (folio-1 BL-01 only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect first-of-kind LLM-vision result
        id: detect
        run: |
          git fetch origin main:main
          MAIN_COUNT=$(git ls-tree -r main --name-only | grep -E '^results/llm_vision/[^/]+\.json$' | wc -l | tr -d ' ')
          PR_COUNT=$(git diff main..HEAD --name-only --diff-filter=A | grep -E '^results/llm_vision/[^/]+\.json$' | wc -l | tr -d ' ')
          echo "main_count=$MAIN_COUNT" >> "$GITHUB_OUTPUT"
          echo "pr_adds=$PR_COUNT" >> "$GITHUB_OUTPUT"
      - name: Enforce [YOSEF-REVIEW] prefix on first-of-kind PR
        if: steps.detect.outputs.main_count == '0' && steps.detect.outputs.pr_adds != '0'
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          if [[ "$TITLE" != "[YOSEF-REVIEW]"* ]]; then
            echo "::error::First BL-01 LLM-vision PR requires [YOSEF-REVIEW] prefix in title (per Phase 3.1 A-03)."
            echo "::error::Current title: $TITLE"
            exit 1
          fi
          echo "First-of-kind PR with [YOSEF-REVIEW] prefix - gate satisfied."
