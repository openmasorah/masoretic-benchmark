[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "masoretic-eval"
version = "0.1.0"
description = "4-tier CER scorer for medieval Hebrew manuscripts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Ben Lamm" }]
dependencies = [
    "grapheme>=0.6.0",
    "click>=8.1",
    "lxml>=5.0",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.5",
    "mypy>=1.8",
    "pre-commit>=3.5",
    "PyICU>=2.11; platform_system != 'Windows'",
]

[project.scripts]
masoretic-eval = "masoretic_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["masoretic_eval"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
